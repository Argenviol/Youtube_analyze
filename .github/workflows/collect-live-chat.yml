# 치지직 생방송 채팅 집계 — 분당 채팅·고유 시청자·후원 건수와 후원 금액, 시청자(고유 id)별 한 시간 채팅 수.
# 스텔라이브 15명이 방송을 켜면 채팅방(읽기 전용·로그인 불필요)에 접속해 집계하고, 꺼지면 닫는다. 채팅 본문·닉네임은 저장하지 않는다.
# 6시간마다 깨어나 약 5시간 40분 동안 돈다(잡 제한 6시간). 사이 10~20분은 비는 구간이다 — 소급할 수 없고 추정으로 채우지 않는다.
# 수집 단계에 자체 시간 제한(345분)을 둬서, 시간 초과로 취소돼도 '변경분 커밋'이 돈다.

name: collect-live-chat

on:
  schedule:
    - cron: "5 */6 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "수집 시간(분). 짧게 시험하려면 5"
        required: false
        default: "340"

permissions:
  contents: write

concurrency:
  group: collect-live-chat
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    defaults:
      run:
        working-directory: youtube_analyze_all
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: youtube_analyze_all/requirements.txt

      - run: pip install -r requirements.txt

      - name: 생방 채팅 집계
        timeout-minutes: 345
        env:
          MINUTES: ${{ inputs.minutes }}
        run: |
          M="${MINUTES:-340}"
          echo "$M" | grep -Eq '^[0-9]+(\.[0-9]+)?$' || { echo "minutes 형식 오류: $M"; exit 1; }
          python collect/chzzk_live_chat.py --minutes "$M"

      - name: 변경분 커밋
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A collect/data
          git diff --staged --quiet || git commit -m "chore: 생방 채팅 집계 $(date -u +%Y-%m-%dT%H:%MZ)"
          for try in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && break
            echo "push 재시도 $try"
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
