# 치지직 전체 방송 시청자(상위 500개 합계) + 버튜버 명단 시청자 — 매시간 쌓는 시계열(과거 소급 불가).
# 명단은 youtube_analyze_all/collect/vtuber_roster.csv (운영자가 확인해 올린 채널만). 후보는 vtuber_candidates.csv 에 쌓인다.
# API 키 불필요. 실패해도 이미 쌓인 데이터는 그대로다.

name: collect-vtubers

on:
  schedule:
    - cron: "7 * * * *" # 매시 7분
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-vtubers
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: youtube_analyze_all
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: youtube_analyze_all/requirements.txt

      - run: pip install -r requirements.txt

      - name: 측정
        run: python collect/chzzk_vtubers.py

      - name: 변경분 커밋
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A collect/data
          git diff --staged --quiet || git commit -m "chore: 치지직 전체·버튜버 시청자 $(date -u +%Y-%m-%dT%H:%MZ)"
          for try in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && break
            echo "push 재시도 $try"
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
