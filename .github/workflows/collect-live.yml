# 프로젝트 8(동시시청자) 수집 — 소급 불가라 가장 중요하다.
#
# ## 왜 "한 번 깨어나 한 장"이 아니라 "한 번 깨어나 5시간 반" 인가
#
# 원래는 cron "*/10" 이 매번 스냅샷 1장을 찍고 끝났다. 그런데 GitHub 스케줄러는
# cron 집행을 보장하지 않고, 이 저장소에서 실측으로 점점 나빠졌다:
#   8/13~18: 중앙값 ~35분   →   8/26~28: 중앙값 64분, 8~10시간 공백 3회
# 소급 수집이 불가능한 지표라 저 공백은 영구 손실이다.
#
# 그래서 구조를 뒤집었다: 스케줄러가 언제 깨워주느냐에 목숨 걸지 않고, **한 번
# 깨어나면 잡 안에서 10분 간격으로 최대 5시간 반 동안 계속 찍는다.** 매 반복마다
# 커밋·푸시하므로 잡이 중간에 죽어도 그때까지 찍은 것은 남는다. concurrency 그룹이
# 겹침을 막고(뒤 실행은 큐에서 대기 후 이어받음), cron 은 1시간으로 두어 앞 잡이
# 끝나면 다음 잡이 사슬처럼 이어진다. 스케줄러가 6시간에 한 번만 깨워줘도
# 커버리지가 유지된다.
#
# 공개 저장소는 Actions 러너 시간이 무료라 장시간 잡의 비용 문제는 없다.
# (비공개로 전환하면 월 2,000분 무료를 하루 만에 소진하니 이 설계를 버려야 한다.)
#
# ## 2026-09-08 · 잡의 절반이 조용히 아무것도 안 남기던 문제
#
# 9/4~9/8 나흘 동안 스냅샷의 54%가 비어 있었다. 성공으로 끝난 잡이 5시간 반 동안
# 단 한 줄도 푸시하지 못한 채 exit 0 으로 끝나고 있었다. 원인은 체크아웃 시점이다.
#
# GitHub 은 잡이 **큐에 들어간 순간의 sha** 를 체크아웃한다. 앞 잡이 돌고 있는 동안
# 큐에 들어간 잡은 앞 잡이 끝날 때까지 몇 시간을 기다리는데, 그동안 앞 잡이
# snapshots.csv 에 30여 커밋을 밀어 넣는다. 뒤 잡이 시작해서 첫 스냅샷을 커밋하고
# `git pull --rebase` 를 하면, **같은 CSV 의 같은 끝자리에 양쪽이 줄을 붙인 상태**라
# 반드시 충돌한다. rebase 가 멈추면 HEAD 가 분리되고, 그다음부터 매 반복이
#   - analyze.py: "Time data <<<<<<< HEAD is not ISO8601"  (충돌 마커가 CSV 에 남음)
#   - git commit: 분리된 HEAD 에 커밋 (아무 데도 안 감)
#   - git pull:   "You are not currently on a branch"      (푸시 영영 실패)
# 로 5시간을 돌다 끝난다. 잡은 실패하지 않으므로 알림도 없었다 — 9/6 의 실패 알림은
# 러너가 셧다운 신호(exit 143)를 받은 단 한 번뿐이었고, 그것이 이 문제를 드러냈다.
#
# 고친 것 두 가지.
#   1) 잡 시작 시 origin/main 으로 강제 동기화한다. 큐에서 몇 시간을 기다렸든 첫
#      커밋은 최신 위에 올라간다.
#   2) 푸시가 3회 실패하면 **그 스냅샷 하나를 버리고** origin/main 으로 돌아간다.
#      10분치를 잃는 쪽이 5시간치를 잃는 것보다 낫다.

name: collect-live

on:
  schedule:
    - cron: "0 * * * *" # 매시 — 앞 잡(최대 5.5h)이 돌고 있으면 큐에서 대기 후 이어받는다
  workflow_dispatch: # 수동 실행 버튼

permissions:
  contents: write # 수집한 데이터를 저장소에 커밋해야 한다

concurrency:
  group: collect-live # 동시에 두 잡이 찍지 않게. cancel 안 함 — 큐 1개가 이어달리기 주자다
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # 반복 루프(최대 ~330분) + 여유
    defaults:
      run:
        working-directory: youtube_analyze_all
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: youtube_analyze_all/requirements.txt

      - run: pip install -r requirements.txt

      # 차트 라벨이 전부 한글이다. 러너에는 한글 폰트가 없어서, 없으면 matplotlib 이
      # DejaVu Sans 로 폴백해 모든 글자가 □(tofu)로 렌더된다.
      - name: 한글 폰트 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum

      # 체크아웃은 큐에 들어간 시점의 sha 다(위 2026-09-08 메모). 큐에서 기다리는 동안
      # 앞 잡이 밀어 넣은 커밋 위에 올라서야 첫 rebase 가 충돌하지 않는다.
      - name: 최신 main 으로 동기화
        run: |
          git fetch origin main
          git checkout -B main origin/main
          echo "시작 sha: $(git rev-parse --short HEAD) (체크아웃 sha ${GITHUB_SHA:0:7})"

      # 08은 치지직 비공식 API만 쓴다 — API 키가 필요 없다.
      #
      # 33회 × (수집·분석 ~40초 + 대기 600초) ≈ 5시간 30분.
      # 매 반복마다 커밋·푸시한다 — 잡이 러너 회수 등으로 중간에 죽어도 이미 찍은
      # 스냅샷은 원격에 남아 있어야 한다(소급 불가). 한 반복의 수집 실패는 루프를
      # 죽이지 않는다: 다음 반복이 다시 시도하는 쪽이 그 시점을 통째로 버리는 것보다
      # 낫다. 푸시는 daily/weekly 워크플로와 경합할 수 있어 pull --rebase 후 3회
      # 재시도한다.
      - name: 수집 루프 (10분 × 33회)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in $(seq 1 33); do
            echo "── 반복 $i/33 · $(date -u +%H:%M)"
            python scripts/refresh.py --group live || echo "  (이번 반복 실패 — 다음 반복에서 재시도)"
            git add -A 08_live_viewership/
            if ! git diff --staged --quiet; then
              git commit -m "chore(08): 동시시청자 스냅샷 $(date -u +%Y-%m-%dT%H:%MZ)"
              pushed=0
              for try in 1 2 3; do
                if git pull --rebase --autostash origin main && git push origin HEAD:main; then
                  pushed=1; break
                fi
                echo "  push 재시도 $try"
                git rebase --abort 2>/dev/null || true
                sleep 10
              done
              if [ "$pushed" = 0 ]; then
                # 이 스냅샷 하나를 버리고 깨끗한 origin/main 으로 돌아간다.
                # 여기서 버티면 남은 반복 전부가 분리된 HEAD 에 쌓여 통째로 사라진다.
                echo "  ⚠ 푸시 3회 실패 — 이번 스냅샷을 버리고 origin/main 으로 복귀"
                git rebase --abort 2>/dev/null || true
                git reset --hard
                git fetch origin main && git checkout -B main origin/main
              fi
            fi
            # ⚠️ `[ cond ] && sleep` 를 루프의 마지막 명령으로 두면, 마지막 반복(i=33)에서
            #    조건이 거짓이라 그 줄의 종료 코드가 1이 되고 → 스크립트 전체가 exit 1 →
            #    33장을 전부 찍고 푸시한 뒤에 잡이 "실패"로 표시된다. 매 실행마다 실패 메일이
            #    오던 원인이 이것이다(로그: 33/33 푸시 성공 직후 "exit code 1"). if 문으로 바꾼다.
            if [ "$i" -lt 33 ]; then sleep 600; fi
          done
