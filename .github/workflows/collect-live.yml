# 프로젝트 8(동시시청자) 수집 — 소급 불가라 가장 중요하다.
#
# ⚠ 비용
#   공개 저장소  : Actions 무제한 무료 → 10분 간격 그대로 가능
#   비공개 저장소: 월 2,000분 무료. 10분 간격이면 월 4,320회 × 약 1분이라 한도를 넘겨
#                 과금된다. 비공개로 쓰려면 아래 cron 을 "0 * * * *"(1시간)로 늘릴 것.
#
# ⚠ GitHub Actions cron 은 정시를 보장하지 않는다. 부하에 따라 수 분~수십 분 밀린다.
#   10분으로 적어도 실제로는 10~20분 간격이 된다. 분석 코드는 불규칙 간격을 전제로
#   작성돼 있고(세션 재구성이 25분 gap 기준), 커버리지도 span 이 아니라 실제 찍은
#   시점 수로 계산하므로 밀림이 지표를 왜곡하지 않는다.

name: collect-live

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: # 수동 실행 버튼

permissions:
  contents: write # 수집한 데이터를 저장소에 커밋해야 한다

concurrency:
  group: collect-live # 앞 실행이 안 끝났으면 큐만 쌓이지 않게 한다
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: youtube_analyze_all
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: youtube_analyze_all/requirements.txt

      - run: pip install -r requirements.txt

      # 08은 치지직 비공식 API만 쓴다 — API 키가 필요 없다.
      - name: 수집 → 분석 → 사이트 재생성
        run: python scripts/refresh.py --group live

      # 08은 소급 수집이 불가능하다. 분석이나 사이트 생성이 죽어도 이미 찍은 스냅샷은
      # 반드시 남겨야 한다 — 이 단계가 skip 되면 그 시점 데이터는 영구 공백이 된다.
      - name: 변경분 커밋
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A 08_live_viewership/
          # 변경이 없으면 커밋하지 않는다(빈 커밋으로 히스토리를 더럽히지 않도록).
          git diff --staged --quiet || git commit -m "chore(08): 동시시청자 스냅샷 $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash
          git push
