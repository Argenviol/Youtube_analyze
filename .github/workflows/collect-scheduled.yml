# daily / weekly / monthly 그룹 수집.
#
# live 와 달리 실행 횟수가 적어(월 35회 남짓) 비공개 저장소의 무료 한도 안에 들어온다.
#
# YouTube 쿼터 (한도: 일 10,000 units + search.list 별도 100회/일)
#   daily   01·02·03·06 → search  0회, 약   250 units
#   weekly  04·05·10·11 → search 33회, 약 3,400 units
#   monthly 09          → DART만 사용, YouTube 쿼터 미사용
# 요일이 분리돼 있어 같은 날 겹치지 않는다.

name: collect-scheduled

on:
  schedule:
    - cron: "0 20 * * *" # 매일 05:00 KST
    - cron: "30 20 * * 6" # 매주 일요일 05:30 KST
    - cron: "0 21 4 * *" # 매월 5일 06:00 KST
  workflow_dispatch:
    inputs:
      group:
        description: "수동 실행할 그룹"
        required: true
        default: daily
        type: choice
        options: [daily, weekly, monthly, all]

permissions:
  contents: write

concurrency:
  group: collect-scheduled
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: youtube_analyze_all
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: youtube_analyze_all/requirements.txt

      - run: pip install -r requirements.txt

      - name: 실행할 그룹 결정
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "group=${{ inputs.group }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 20 * * 6" ]; then
            echo "group=weekly" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 21 4 * *" ]; then
            echo "group=monthly" >> "$GITHUB_OUTPUT"
          else
            echo "group=daily" >> "$GITHUB_OUTPUT"
          fi

      - name: 수집 → 분석 → 사이트 재생성
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/refresh.py --group ${{ steps.pick.outputs.group }}

      # always() 가 핵심이다. refresh.py 는 프로젝트별 실패를 격리해서 나머지를 계속
      # 돌리도록 짜여 있는데(한 프로젝트가 죽어도 continue), 하나라도 실패하면 exit 1 을
      # 반환한다. 이 단계에 조건이 없으면 그 exit 1 때문에 통째로 skip 되고, 같은 잡에서
      # 성공한 프로젝트가 방금 수집한 데이터까지 버려진다. 실제로 그런 적이 있다 —
      # 키 미등록으로 01·02·06 이 죽으면서 03 이 28초 걸려 받아온 데이터가 사라졌다.
      # 잡 자체는 계속 빨갛게 두어 실패가 눈에 띄게 한다.
      - name: 변경분 커밋
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: ${{ steps.pick.outputs.group }} 갱신 $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash
          git push
